<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" fill="none" class="architecture-svg">
  <defs>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="grad-warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A97F" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F5A97F" stop-opacity="0.05"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#5EEAD4"/>
    </marker>
    <marker id="arrow-subtle" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6B6D74"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="520" rx="12" fill="#131417" stroke="#26282D" stroke-width="1.5"/>

  <!-- Grid Guide -->
  <g stroke="#26282D" stroke-width="1" stroke-dasharray="4 4" opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="520"/>
    <line x1="280" y1="0" x2="280" y2="520"/>
    <line x1="680" y1="0" x2="680" y2="520"/>
    <line x1="880" y1="0" x2="880" y2="520"/>
  </g>

  <!-- Title / Spec Header -->
  <text x="32" y="42" fill="#EDEDEF" font-family="monospace" font-size="14" font-weight="600" letter-spacing="1">SYSTEM: DECODER-ONLY TRANSFORMER BLOCK</text>
  <text x="730" y="42" fill="#5EEAD4" font-family="monospace" font-size="12">STATUS: OPTIMIZED FP16/BF16</text>

  <!-- Flow Section 1: Input & Tokenization -->
  <g transform="translate(40, 70)">
    <rect width="180" height="70" rx="8" fill="#1B1D21" stroke="#26282D" stroke-width="1.5"/>
    <text x="16" y="28" fill="#5EEAD4" font-family="monospace" font-size="11" font-weight="600">INPUT SEQUENCE</text>
    <text x="16" y="48" fill="#EDEDEF" font-family="sans-serif" font-size="13">Raw Text &gt; BPE Tokens</text>
    <text x="16" y="62" fill="#9A9CA3" font-family="monospace" font-size="10">Vocab: 32,000 · [B, S]</text>
  </g>

  <!-- Connector to Embeddings -->
  <path d="M 220 105 L 260 105" stroke="#5EEAD4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Flow Section 2: Token Embedding -->
  <g transform="translate(270, 70)">
    <rect width="180" height="70" rx="8" fill="#1B1D21" stroke="#26282D" stroke-width="1.5"/>
    <text x="16" y="28" fill="#5EEAD4" font-family="monospace" font-size="11" font-weight="600">TOKEN EMBEDDING</text>
    <text x="16" y="48" fill="#EDEDEF" font-family="sans-serif" font-size="13">W_e Projection</text>
    <text x="16" y="62" fill="#9A9CA3" font-family="monospace" font-size="10">Tensor: [B, S, d_model]</text>
  </g>

  <!-- Connector to Main Transformer Core -->
  <path d="M 360 140 L 360 170" stroke="#5EEAD4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Main Transformer Block Container -->
  <rect x="40" y="180" width="880" height="260" rx="10" fill="url(#grad-accent)" stroke="#5EEAD4" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="205" fill="#5EEAD4" font-family="monospace" font-size="12" font-weight="600">TRANSFORMER LAYER x L (Residual Stream Active)</text>

  <!-- Component 1: RMSNorm 1 -->
  <g transform="translate(60, 225)">
    <rect width="120" height="80" rx="6" fill="#1B1D21" stroke="#26282D" stroke-width="1.5"/>
    <text x="12" y="26" fill="#F5A97F" font-family="monospace" font-size="11" font-weight="600">Pre-RMSNorm</text>
    <text x="12" y="46" fill="#EDEDEF" font-family="sans-serif" font-size="11">RMS(x) * gamma</text>
    <text x="12" y="66" fill="#9A9CA3" font-family="monospace" font-size="9">No mean subtraction</text>
  </g>

  <path d="M 180 265 L 210 265" stroke="#5EEAD4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Component 2: RoPE Rotation -->
  <g transform="translate(220, 225)">
    <rect width="150" height="80" rx="6" fill="#1B1D21" stroke="#26282D" stroke-width="1.5"/>
    <text x="12" y="26" fill="#5EEAD4" font-family="monospace" font-size="11" font-weight="600">RoPE Injection</text>
    <text x="12" y="46" fill="#EDEDEF" font-family="sans-serif" font-size="11">Rotary 2D Polar Q/K</text>
    <text x="12" y="66" fill="#9A9CA3" font-family="monospace" font-size="9">Relative distance aware</text>
  </g>

  <path d="M 370 265 L 400 265" stroke="#5EEAD4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Component 3: Grouped Query Attention + KV Cache -->
  <g transform="translate(410, 215)">
    <rect width="210" height="100" rx="6" fill="#1B1D21" stroke="#5EEAD4" stroke-width="1.5"/>
    <text x="14" y="24" fill="#5EEAD4" font-family="monospace" font-size="11" font-weight="700">Grouped-Query Attention</text>
    <text x="14" y="44" fill="#EDEDEF" font-family="sans-serif" font-size="12">Flash Causal Softmax</text>
    <text x="14" y="64" fill="#9A9CA3" font-family="monospace" font-size="10">8 KV Heads : 32 Q Heads</text>
    <rect x="14" y="74" width="180" height="18" rx="3" fill="#26282D"/>
    <text x="20" y="87" fill="#5EEAD4" font-family="monospace" font-size="9">Static Paged KV-Cache Pool</text>
  </g>

  <path d="M 620 265 L 650 265" stroke="#5EEAD4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Component 4: RMSNorm 2 -->
  <g transform="translate(660, 225)">
    <rect width="100" height="80" rx="6" fill="#1B1D21" stroke="#26282D" stroke-width="1.5"/>
    <text x="10" y="26" fill="#F5A97F" font-family="monospace" font-size="11" font-weight="600">RMSNorm 2</text>
    <text x="10" y="46" fill="#EDEDEF" font-family="sans-serif" font-size="11">Pre-FFN</text>
    <text x="10" y="66" fill="#9A9CA3" font-family="monospace" font-size="9">Fused Dispatch</text>
  </g>

  <path d="M 760 265 L 780 265" stroke="#5EEAD4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Component 5: SwiGLU FFN -->
  <g transform="translate(790, 225)">
    <rect width="115" height="80" rx="6" fill="#1B1D21" stroke="#26282D" stroke-width="1.5"/>
    <text x="10" y="26" fill="#5EEAD4" font-family="monospace" font-size="11" font-weight="600">SwiGLU FFN</text>
    <text x="10" y="46" fill="#EDEDEF" font-family="sans-serif" font-size="10">(W_gate * SiLU) * W_up</text>
    <text x="10" y="66" fill="#9A9CA3" font-family="monospace" font-size="9">Dim: 8/3 * d_model</text>
  </g>

  <!-- Residual Bypass Highway Lines -->
  <path d="M 80 180 L 80 160 L 850 160 L 850 220" stroke="#F5A97F" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  <text x="440" y="152" fill="#F5A97F" font-family="monospace" font-size="10" text-anchor="middle">Residual Highway Stream (+x)</text>

  <!-- Output Generation & Loss -->
  <g transform="translate(560, 455)">
    <rect width="360" height="50" rx="6" fill="#1B1D21" stroke="#5EEAD4" stroke-width="1.5"/>
    <text x="16" y="24" fill="#5EEAD4" font-family="monospace" font-size="11" font-weight="600">OUTPUT HEAD &amp; LOSS</text>
    <text x="16" y="40" fill="#EDEDEF" font-family="sans-serif" font-size="12">RMSNorm &gt; Linear Projection &gt; Cross-Entropy / DPO</text>
  </g>

  <path d="M 850 310 L 850 450" stroke="#5EEAD4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend & Specs -->
  <g transform="translate(40, 460)">
    <rect width="460" height="45" rx="6" fill="#1B1D21" stroke="#26282D" stroke-width="1"/>
    <circle cx="20" cy="22" r="4" fill="#5EEAD4"/>
    <text x="32" y="26" fill="#EDEDEF" font-family="sans-serif" font-size="11">Rotary Positional Embeddings</text>
    <circle cx="210" cy="22" r="4" fill="#F5A97F"/>
    <text x="222" y="26" fill="#EDEDEF" font-family="sans-serif" font-size="11">Pre-RMSNorm Stream</text>
    <circle cx="360" cy="22" r="4" fill="#34D399"/>
    <text x="372" y="26" fill="#EDEDEF" font-family="sans-serif" font-size="11">Grouped KV-Cache</text>
  </g>
</svg>
