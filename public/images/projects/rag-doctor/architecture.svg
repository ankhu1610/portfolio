<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" fill="none" class="architecture-svg">
  <defs>
    <linearGradient id="rag-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="rag-grad-warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A97F" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F5A97F" stop-opacity="0.03"/>
    </linearGradient>
    <marker id="rag-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#5EEAD4"/>
    </marker>
    <marker id="rag-arrow-warm" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F5A97F"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="520" rx="12" fill="#131417" stroke="#26282D" stroke-width="1.5"/>

  <!-- Title / Spec Header -->
  <text x="32" y="40" fill="#EDEDEF" font-family="monospace" font-size="14" font-weight="600" letter-spacing="1">SYSTEM: RAGDOCTOR MULTI-STAGE DIAGNOSTIC TRACE</text>
  <text x="710" y="40" fill="#5EEAD4" font-family="monospace" font-size="12">STATUS: SHIPPED // 245 TEST CASES</text>

  <!-- Stage 1: User Query & Perturbation Engine -->
  <g transform="translate(36, 75)" id="perturbation-node">
    <rect width="160" height="85" rx="8" fill="#1B1D21" stroke="#26282D" stroke-width="1.5"/>
    <text x="14" y="24" fill="#5EEAD4" font-family="monospace" font-size="11" font-weight="600">STAGE 01 // INPUT</text>
    <text x="14" y="46" fill="#EDEDEF" font-family="sans-serif" font-size="13" font-weight="600">Query Perturbation</text>
    <text x="14" y="66" fill="#9A9CA3" font-family="monospace" font-size="10">Paraphrase / Drift Probe</text>
  </g>

  <!-- Arrow to Dual Retrieval -->
  <path d="M 196 117 L 236 117" stroke="#5EEAD4" stroke-width="1.5" marker-end="url(#rag-arrow)"/>

  <!-- Stage 2: Dual Sparse & Dense Retrieval Box -->
  <g transform="translate(240, 65)" id="retriever-node">
    <rect width="210" height="180" rx="10" fill="url(#rag-grad-accent)" stroke="#5EEAD4" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="16" y="25" fill="#5EEAD4" font-family="monospace" font-size="11" font-weight="600">STAGE 02 // DUAL RETRIEVAL</text>
    
    <!-- Dense Path -->
    <rect x="16" y="40" width="178" height="52" rx="6" fill="#1B1D21" stroke="#26282D" stroke-width="1"/>
    <text x="26" y="60" fill="#EDEDEF" font-family="sans-serif" font-size="12" font-weight="500">Dense Index (FAISS)</text>
    <text x="26" y="78" fill="#9A9CA3" font-family="monospace" font-size="9.5">bge-large · Top-50 Vectors</text>

    <!-- Sparse Path -->
    <rect x="16" y="105" width="178" height="52" rx="6" fill="#1B1D21" stroke="#26282D" stroke-width="1"/>
    <text x="26" y="125" fill="#EDEDEF" font-family="sans-serif" font-size="12" font-weight="500">Sparse Index (BM25)</text>
    <text x="26" y="143" fill="#9A9CA3" font-family="monospace" font-size="9.5">Exact Lexical · Top-50 Inverted</text>
  </g>

  <!-- Arrow to RRF Fusion -->
  <path d="M 450 155 L 490 155" stroke="#5EEAD4" stroke-width="1.5" marker-end="url(#rag-arrow)"/>

  <!-- Stage 3: Reciprocal Rank Fusion & Cross-Encoder -->
  <g transform="translate(494, 75)" id="rrf-node">
    <rect width="190" height="85" rx="8" fill="#1B1D21" stroke="#26282D" stroke-width="1.5"/>
    <text x="14" y="24" fill="#5EEAD4" font-family="monospace" font-size="11" font-weight="600">STAGE 03 // RRF FUSION</text>
    <text x="14" y="46" fill="#EDEDEF" font-family="sans-serif" font-size="13" font-weight="600">Reciprocal Rank (k=60)</text>
    <text x="14" y="66" fill="#9A9CA3" font-family="monospace" font-size="10">Calibrated Candidate Pool</text>
  </g>

  <!-- Arrow to Cross-Encoder -->
  <path d="M 684 117 L 724 117" stroke="#5EEAD4" stroke-width="1.5" marker-end="url(#rag-arrow)"/>

  <!-- Stage 4: Cross-Encoder Reranker -->
  <g transform="translate(728, 75)" id="cross-encoder-node">
    <rect width="196" height="85" rx="8" fill="#1B1D21" stroke="#26282D" stroke-width="1.5"/>
    <text x="14" y="24" fill="#5EEAD4" font-family="monospace" font-size="11" font-weight="600">STAGE 04 // RERANKER</text>
    <text x="14" y="46" fill="#EDEDEF" font-family="sans-serif" font-size="13" font-weight="600">Cross-Encoder (MiniLM)</text>
    <text x="14" y="66" fill="#9A9CA3" font-family="monospace" font-size="10">Top-15 Precision Pruning</text>
  </g>

  <!-- Connector from Reranker down to Diagnosis Layer -->
  <path d="M 826 160 L 826 280 L 780 280" stroke="#F5A97F" stroke-width="1.5" marker-end="url(#rag-arrow-warm)"/>

  <!-- Lower Section: Context Window & Generator + NLI Verifier -->
  <g transform="translate(36, 280)">
    <!-- Context Assembly -->
    <g transform="translate(0, 0)">
      <rect width="210" height="95" rx="8" fill="#1B1D21" stroke="#26282D" stroke-width="1.5"/>
      <text x="14" y="24" fill="#5EEAD4" font-family="monospace" font-size="11" font-weight="600">CONTEXT ASSEMBLY</text>
      <text x="14" y="46" fill="#EDEDEF" font-family="sans-serif" font-size="13" font-weight="600">U-Shaped Attribution</text>
      <text x="14" y="66" fill="#9A9CA3" font-family="monospace" font-size="10">Pruned Evidence Passages</text>
      <text x="14" y="82" fill="#5EEAD4" font-family="monospace" font-size="10">Position Bias Mitigation</text>
    </g>

    <!-- Arrow to Generator -->
    <path d="M 210 47 L 250 47" stroke="#5EEAD4" stroke-width="1.5" marker-end="url(#rag-arrow)"/>

    <!-- Generator LLM -->
    <g transform="translate(254, 0)">
      <rect width="210" height="95" rx="8" fill="#1B1D21" stroke="#26282D" stroke-width="1.5"/>
      <text x="14" y="24" fill="#5EEAD4" font-family="monospace" font-size="11" font-weight="600">GENERATOR LLM</text>
      <text x="14" y="46" fill="#EDEDEF" font-family="sans-serif" font-size="13" font-weight="600">Conditioned Synthesis</text>
      <text x="14" y="66" fill="#9A9CA3" font-family="monospace" font-size="10">Autoregressive Answer Tokens</text>
      <text x="14" y="82" fill="#9A9CA3" font-family="monospace" font-size="10">Raw Claim Extraction</text>
    </g>

    <!-- Arrow to NLI Verifier -->
    <path d="M 464 47 L 504 47" stroke="#F5A97F" stroke-width="1.5" marker-end="url(#rag-arrow-warm)"/>

    <!-- NLI Hallucination Verification Probe -->
    <g transform="translate(508, -15)" id="nli-node">
      <rect width="380" height="125" rx="10" fill="url(#rag-grad-warm)" stroke="#F5A97F" stroke-width="1.5"/>
      <text x="16" y="26" fill="#F5A97F" font-family="monospace" font-size="11" font-weight="600">STAGE 05 // DEBERTA NLI VERIFIER (DIAGNOSTIC ENGINE)</text>
      
      <rect x="16" y="38" width="348" height="34" rx="4" fill="#1B1D21" stroke="#26282D" stroke-width="1"/>
      <text x="26" y="58" fill="#EDEDEF" font-family="sans-serif" font-size="11.5">Claim Decomposition: Sub-clause Premise vs Target</text>
      
      <rect x="16" y="78" width="348" height="34" rx="4" fill="#1B1D21" stroke="#26282D" stroke-width="1"/>
      <text x="26" y="98" fill="#5EEAD4" font-family="monospace" font-size="10.5">Tri-Class Output: Entailed (Valid) · Neutral · Contradiction</text>
    </g>
  </g>

  <!-- Diagnostic Output Summary Strip -->
  <g transform="translate(36, 440)">
    <rect width="888" height="50" rx="8" fill="#1B1D21" stroke="#26282D" stroke-width="1"/>
    <text x="24" y="30" fill="#5EEAD4" font-family="monospace" font-size="11" font-weight="600">DIAGNOSTIC TELEMETRY:</text>
    <text x="190" y="30" fill="#EDEDEF" font-family="monospace" font-size="11">Retrieval Recall@5: 89.4%</text>
    <text x="410" y="30" fill="#EDEDEF" font-family="monospace" font-size="11">Context Precision: 94.2%</text>
    <text x="630" y="30" fill="#F5A97F" font-family="monospace" font-size="11">Failure Localization F1: 91.8%</text>
  </g>
</svg>
